name: e2e

on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string
      environment:
        # `e2e` requires reviewer approval and is used for fork PRs, whose code runs with the Proxmox
        # credentials. `e2e-trusted` holds the same secrets without an approval gate, for pushes to
        # main and internal PRs.
        required: true
        type: string
      focus:
        description: Ginkgo focus regexp. PRs run the capmox specs; the nightly run adds the upstream CAPI specs.
        required: false
        type: string
        default: Workload cluster creation

permissions:
  contents: read

jobs:
  e2e:
    runs-on: capmox-e2e
    environment: ${{ inputs.environment }}
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    env:
      PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
      PROXMOX_TOKEN: ${{ secrets.PROXMOX_TOKEN }}
      PROXMOX_SECRET: ${{ secrets.PROXMOX_SECRET }}
      # Kubernetes version baked into TEMPLATEID_UPGRADE_TO, set as an environment variable in the lab.
      KUBERNETES_VERSION_UPGRADE_TO: ${{ vars.KUBERNETES_VERSION_UPGRADE_TO }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # checkout v7 requires this for fork-PR head checkout under pull_request_target.
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: make test-e2e "GINKGO_SKIP=$SKIP_E2E" "GINKGO_FOCUS=$FOCUS"
        env:
          FOCUS: ${{ inputs.focus }}
          # Skip Flatcar on PRs unless the e2e/flatcar label is set; pushes to main and the nightly run include it.
          SKIP_E2E: ${{ (startsWith(inputs.event_name, 'pull_request') && !contains(github.event.pull_request.labels.*.name, 'e2e/flatcar')) && 'Flatcar' || '' }}

      - name: Upload logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: logs
          path: _artifacts
          retention-days: 7

      - name: Clean up kind clusters
        if: always() || success() || failure()
        run: |
          go tool kind get clusters | xargs -I% go tool kind delete cluster --name %
          docker system prune -a -f
